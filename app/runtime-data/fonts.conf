<?xml version="1.0"?>
<!-- Fonts for apps on ohos-wayland: the HarmonyOS system fonts, with the
     generic and GNOME UI names mapped to HarmonyOS Sans, and monospace to
     the system's Noto Sans Mono (terminals otherwise get a proportional font). -->
<fontconfig>
  <dir>/system/fonts</dir>
  <cachedir>/data/storage/el2/base/cache/fontconfig</cachedir>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>HarmonyOS Sans</family>
      <family>HarmonyOS Sans SC</family>
      <family>HarmonyOS Sans TC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>HarmonyOS Sans</family><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>HarmonyOS Sans</family><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Adwaita Sans</family>
    <prefer><family>HarmonyOS Sans</family><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cantarell</family>
    <prefer><family>HarmonyOS Sans</family><family>HarmonyOS Sans SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Adwaita Mono</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
